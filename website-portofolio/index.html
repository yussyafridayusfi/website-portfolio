<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yussyafrida C.R. — Software Developer, Backend Engineering</title>
    <meta
      name="description"
      content="Portfolio of Yussyafrida C.R., a software developer in Sidoarjo, Indonesia, building internal business applications with .NET/C#, Node.js, SQL and PostgreSQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yussyafrida C.R. — Software Developer" />
    <meta
      property="og:description"
      content="Selected projects and public repositories from a software developer working in .NET/C#, Node.js, SQL and PostgreSQL."
    />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131514" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      ;(function () {
        // Apply the stored theme and language before first paint.
        try {
          var storedTheme = localStorage.getItem('theme')
          var dark =
            storedTheme === 'dark' ||
            (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'

          var storedLanguage = localStorage.getItem('language')
          if (storedLanguage === 'en' || storedLanguage === 'id') {
            document.documentElement.lang = storedLanguage
          } else if ((navigator.language || '').toLowerCase().startsWith('id')) {
            document.documentElement.lang = 'id'
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }

        // GitHub Pages answers unknown paths with public/404.html, which stores
        // the intended path and returns here. Restore it before React routes.
        try {
          var redirect = sessionStorage.getItem('spa-redirect')
          if (redirect && redirect.indexOf('/website-portfolio/') === 0) {
            sessionStorage.removeItem('spa-redirect')
            window.history.replaceState(null, '', redirect)
          }
        } catch (error) {
          // A blocked sessionStorage only costs the deep-link restore.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
